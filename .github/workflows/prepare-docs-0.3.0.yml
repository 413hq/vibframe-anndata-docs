name: Prepare 0.3.0 public documentation
on:
  push:
    branches: [docs/0.3.0-complete-ground-truth]
    paths: [.github/workflows/prepare-docs-0.3.0.yml]
permissions:
  contents: write
jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and apply documentation source patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess
          encoded = pathlib.Path('.github/docs-0.3.0.patch.b64').read_text().strip()
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '41adc9ecea7a87070596d1e12db7f583c65bf6d219376982b64c0e23552df643'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
      - name: Install exact published package and documentation toolchain
        run: |
          python -m pip install --upgrade pip -r requirements.txt
          python -m pip install 'vibframe-anndata==0.3.0'
          python -c "import vibframe_anndata as v; assert v.__version__ == '0.3.0'; assert callable(v.add_ground_truth_to_h5ad); assert callable(v.get_waveform_ground_truth)"
      - name: Build and verify public documentation
        run: |
          mkdocs build --strict
          python - <<'PY'
          from pathlib import Path
          guide = Path('site/guides/ground-truth/index.html').read_text()
          api = Path('site/reference/api/index.html').read_text()
          assert 'Complete ground truth and evaluation metadata' in guide
          assert 'vibframe_evaluation' in guide and 'waveform_ground_truth' in guide
          for name in ['get_snapshot_ground_truth', 'get_waveform_ground_truth', 'list_evaluation_files', 'read_evaluation_file', 'read_evaluation_json', 'read_evaluation_table', 'export_evaluation_files', 'add_ground_truth_to_h5ad']:
              assert f'id="vibframe_anndata.{name}"' in api, name
          print('Versioned 0.3.0 guide and all eight API sections verified')
          PY
      - name: Commit validated guide content
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs docs-version.txt README.md mkdocs.yml
          git commit -m 'docs: document complete ground truth for published vibframe-anndata 0.3.0'
          git push origin HEAD:docs/0.3.0-complete-ground-truth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-docs-0.3.0-preview
          path: site/
          retention-days: 7
