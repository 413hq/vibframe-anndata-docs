name: Publish versioned documentation

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      version:
        description: "Package version to document (empty = latest PyPI release)"
        required: false
        type: string
      force:
        description: "Replace an existing documentation snapshot"
        required: false
        default: false
        type: boolean
  repository_dispatch:
    types: [package_release]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write

concurrency:
  group: public-docs-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout documentation source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Resolve package version
        id: version
        env:
          INPUT_VERSION: ${{ github.event.inputs.version || '' }}
          DISPATCH_VERSION: ${{ github.event.client_payload.version || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          requested = os.environ.get("INPUT_VERSION") or os.environ.get("DISPATCH_VERSION")
          if requested:
              version = requested.removeprefix("v")
          else:
              with urllib.request.urlopen(
                  "https://pypi.org/pypi/vibframe-anndata/json", timeout=30
              ) as response:
                  version = json.load(response)["info"]["version"]

          documented = pathlib.Path("docs-version.txt").read_text().strip()
          ready = version == documented
          if not ready:
              print(f"Source guides target {documented}; not publishing {version} from stale guides.")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={version}\n")
              output.write(f"ready={'true' if ready else 'false'}\n")
          print(f"Documentation target: vibframe-anndata=={version}")
          PY

      - name: Fetch existing documentation versions
        run: git fetch origin gh-pages:gh-pages || true

      - name: Decide whether publication is needed
        id: publish
        env:
          VERSION: ${{ steps.version.outputs.version }}
          READY: ${{ steps.version.outputs.ready }}
          FORCE: ${{ github.event.inputs.force || 'false' }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess

          version = os.environ["VERSION"]
          force = os.environ.get("FORCE", "false").lower() == "true"
          exists = False

          try:
              raw = subprocess.check_output(
                  ["git", "show", "gh-pages:versions.json"], text=True
              )
              exists = any(item.get("version") == version for item in json.loads(raw))
          except (subprocess.CalledProcessError, json.JSONDecodeError):
              pass

          should_publish = os.environ.get("READY") == "true" and (force or not exists)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"needed={'true' if should_publish else 'false'}\n")

          if os.environ.get("READY") != "true":
              print("No publication: update source guides and docs-version.txt first.")
          elif exists and not force:
              print(f"Documentation {version} already exists; preserving immutable snapshot.")
          else:
              print(f"Documentation {version} will be published.")
          PY

      - name: Install documentation toolchain
        if: steps.publish.outputs.needed == 'true'
        run: python -m pip install --upgrade pip -r requirements.txt

      - name: Install documented package version
        if: steps.publish.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: python -m pip install "vibframe-anndata==${VERSION}"

      - name: Validate documentation build
        if: steps.publish.outputs.needed == 'true'
        run: mkdocs build --strict

      - name: Configure Git identity
        if: steps.publish.outputs.needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Publish version and update latest
        if: steps.publish.outputs.needed == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mike deploy --branch gh-pages --push --update-aliases "${VERSION}" latest
          mike set-default --branch gh-pages --push latest

      - name: Summary
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NEEDED: ${{ steps.publish.outputs.needed }}
        run: |
          echo "### Versioned documentation" >> "$GITHUB_STEP_SUMMARY"
          echo "- Package: \`vibframe-anndata==${VERSION}\`" >> "$GITHUB_STEP_SUMMARY"
          if [ "$NEEDED" = "true" ]; then
            echo "- Result: published and \`latest\` updated" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- Result: existing snapshot preserved or source-version mismatch; no publication" >> "$GITHUB_STEP_SUMMARY"
          fi
